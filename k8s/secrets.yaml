apiVersion: v1
kind: Secret
metadata:
  name: retell-webhook-secrets
  namespace: retell-webhooks
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # echo -n "your-retell-api-key" | base64
  retell-api-key: eW91ci1yZXRlbGwtYXBpLWtleQ==

  # echo -n "your-webhook-hash" | base64
  webhook-hash: eW91ci13ZWJob29rLWhhc2g=

  # echo -n "https://your-target-endpoint.com/webhook" | base64
  forward-endpoint: aHR0cHM6Ly95b3VyLXRhcmdldC1lbmRwb2ludC5jb20vd2ViaG9vaw==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retell-webhook-config
  namespace: retell-webhooks
data:
  SITE_NAME: "your-site-name"
  PORT: "3000"
  NODE_ENV: "production"
  # IP allowlist configuration
  ONLY_WHITELISTED_SOURCES: "false"
  # Comma-separated list of allowed Retell IP addresses
  # Example: "52.14.14.14,52.15.15.15,34.210.210.210"
  RETELL_ALLOWED_IPS: ""
