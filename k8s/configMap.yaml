apiVersion: v1
kind: ConfigMap
metadata:
  name: retell-webhook-config
  labels:
    app: retell-webhook-service
  # namespace: retell-webhooks
data:
  SITE_NAME: "https://ardnt.io/"
  PORT: "3000"
  NODE_ENV: "production"
  # IP allowlist configuration
  ONLY_WHITELISTED_SOURCES: "false"
  # Comma-separated list of allowed Retell IP addresses
  # Example: "52.14.14.14,52.15.15.15,34.210.210.210"
  RETELL_ALLOWED_IPS: "100.20.5.228"
  # Target endpoint timeout in milliseconds (default: 600000 = 10 minutes)
  TARGET_ENDPOINT_TIMEOUT: "600000"
  DISABLE_RETELL_SIGNATURE_VERIFICATION: "False"
  LOG_FULL_WEBHOOK_REQUESTS: "true"
  # Enable/disable webhook data extraction (removes transcript_object before forwarding)
  # Set to "true" to remove large transcript_object array, "false" to forward complete body
  USE_WEBHOOK_DATA_EXTRACTION: "true"
