apiVersion: apps/v1
kind: Deployment
metadata:
  name: retell-webhook-service
  # namespace: retell-webhooks
  labels:
    app: retell-webhook-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retell-webhook-service
  template:
    metadata:
      labels:
        app: retell-webhook-service
    spec:
      containers:
        - name: retell-webhook
          image: ivansscrobot/ardent-ms-webhooks:0.1.10
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: RETELL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retell-webhook-secrets
                  key: retell-api-key
            - name: WEBHOOK_HASH
              valueFrom:
                secretKeyRef:
                  name: retell-webhook-secrets
                  key: webhook-hash
            - name: FORWARD_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: retell-webhook-secrets
                  key: forward-endpoint
            - name: SITE_NAME
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: SITE_NAME
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: NODE_ENV
            - name: ONLY_WHITELISTED_SOURCES
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: ONLY_WHITELISTED_SOURCES
            - name: RETELL_ALLOWED_IPS
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: RETELL_ALLOWED_IPS
            - name: DISABLE_RETELL_SIGNATURE_VERIFICATION
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: DISABLE_RETELL_SIGNATURE_VERIFICATION
            - name: LOG_FULL_WEBHOOK_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: LOG_FULL_WEBHOOK_REQUESTS
            - name: USE_WEBHOOK_DATA_EXTRACTION
              valueFrom:
                configMapKeyRef:
                  name: retell-webhook-config
                  key: USE_WEBHOOK_DATA_EXTRACTION
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        fsGroup: 1001
      restartPolicy: Always
